<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Studio | Realtime Viewer</title>

  <!-- 웹폰트: Pretendard & JetBrains Mono -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            app: {
              main: '#1a1d24',
              panel: '#1e212b',
              panelAlt: '#181a22',
              border: '#2d313f',
              text: '#cfd3dc',
              heading: '#f3f4f6',
              codeBg: '#2a2e3d',
              codeText: '#e5b967',
              blockBg: '#16181f',
              accent: '#3b82f6',
              accentHover: '#2563eb'
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- 외부 라이브러리 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

  <style>
    /* 다크 테마 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #2d313f;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3e4457;
    }

    /* 마크다운 렌더링 스타일 상세 스펙 (글씨 크기 2~4px 축소 최적화) */
    #preview-render {
      color: #cfd3dc;
      line-height: 1.65;
      font-size: 0.875rem; /* 기존 0.975rem -> 0.875rem (14px) */
      word-break: break-word;
    }

    #preview-render h1,
    #preview-render h2,
    #preview-render h3,
    #preview-render h4,
    #preview-render h5,
    #preview-render h6 {
      color: #f3f4f6;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    #preview-render h1 {
      font-size: 1.45rem; /* 기존 1.85rem 축소 */
      margin-top: 1.6rem;
      margin-bottom: 0.85rem;
      padding-bottom: 0.45rem;
      border-bottom: 1px solid #2d313f;
    }
    #preview-render h1:first-child { margin-top: 0; }

    #preview-render h2 {
      font-size: 1.15rem; /* 약 18.4px (가독성 최적화를 위해 미세 축소) */
      margin-top: 1.25rem;
      margin-bottom: 0.55rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid rgba(45, 49, 63, 0.6);
    }

    #preview-render h3 {
      font-size: 0.985rem; /* 약 15.8px (본문과 자연스러운 대비 유지) */
      margin-top: 1.05rem;
      margin-bottom: 0.4rem;
    }

    #preview-render h4 {
      font-size: 0.925rem; /* 기존 1.05rem 축소 */
      margin-top: 0.9rem;
      margin-bottom: 0.35rem;
    }

    #preview-render p {
      margin-top: 0.4rem;
      margin-bottom: 0.85rem;
    }

    #preview-render strong {
      color: #ffffff;
      font-weight: 600;
    }

    #preview-render em {
      color: #e2e8f0;
      font-style: italic;
    }

    /* 폰트 리가처(합자) 비활성화: !==, ===, => 등이 기호로 뭉쳐지지 않고 원본 텍스트 그대로 표시 */
    code, pre, #editor-input, #preview-render code {
      font-variant-ligatures: none !important;
      font-feature-settings: "liga" 0, "calt" 0 !important;
    }

    /* 인라인 코드 스타일 (다른 글자보다 조금 더 작게 0.82em 설정) */
    #preview-render :not(pre) > code {
      background-color: #2a2e3d;
      color: #e5b967;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82em; /* 본문 대비 작게 축소 */
      padding: 0.18em 0.42em;
      border-radius: 4px;
      border: 1px solid rgba(229, 185, 103, 0.15);
      white-space: break-spaces;
    }

    /* 코드 블록 스타일 */
    #preview-render pre {
      background-color: #16181f;
      border: 1px solid #2d313f;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-top: 0.85rem;
      margin-bottom: 1.1rem;
      position: relative;
      overflow-x: auto;
    }

    #preview-render pre code {
      background: transparent !important;
      padding: 0 !important;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.775rem; /* 코드 글자 크기 축소 (약 12.4px) */
      line-height: 1.6;
    }

    /* Mermaid 다이어그램: markdownlivepreview 스펙 100% 일치 */
    .mermaid {
      overflow-x: auto;
      padding: 12px 0;
      margin: 1.5rem 0;
      text-align: center;
      background: transparent !important;
      border: 0 !important;
    }
    .mermaid svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .mermaid-error {
      color: #ff7b72;
      white-space: pre-wrap;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 1rem;
      background: rgba(255, 123, 114, 0.1);
      border-radius: 6px;
      border: 1px solid rgba(255, 123, 114, 0.3);
    }

    /* 리스트 스타일 */
    #preview-render ul {
      list-style-type: disc;
      padding-left: 1.4rem;
      margin-bottom: 1rem;
    }

    #preview-render ol {
      list-style-type: decimal;
      padding-left: 1.4rem;
      margin-bottom: 1rem;
    }

    #preview-render li {
      margin-bottom: 0.4rem;
      line-height: 1.65;
    }

    #preview-render li > ul,
    #preview-render li > ol {
      margin-top: 0.35rem;
      margin-bottom: 0.35rem;
    }

    /* 인용구 스타일 */
    #preview-render blockquote {
      border-left: 4px solid #3b82f6;
      padding: 0.5rem 0 0.5rem 1rem;
      margin: 1.2rem 0;
      color: #94a3b8;
      background: rgba(30, 33, 43, 0.5);
      border-radius: 0 6px 6px 0;
    }
    #preview-render blockquote p {
      margin: 0;
    }

    /* 테이블 스타일 */
    #preview-render table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
      font-size: 0.925rem;
      border: 1px solid #2d313f;
      border-radius: 6px;
      overflow: hidden;
    }

    #preview-render th,
    #preview-render td {
      border: 1px solid #2d313f;
      padding: 0.6rem 0.85rem;
      text-align: left;
    }

    #preview-render th {
      background-color: #242834;
      color: #f3f4f6;
      font-weight: 600;
    }

    #preview-render tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* 수평 구분선 */
    #preview-render hr {
      border: 0;
      border-top: 1px solid #2d313f;
      margin: 2rem 0;
    }

    /* 링크 */
    #preview-render a {
      color: #60a5fa;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.15s ease;
    }
    #preview-render a:hover {
      color: #93c5fd;
    }

    /* 체크박스 리스트 */
    #preview-render input[type="checkbox"] {
      margin-right: 0.5rem;
      accent-color: #3b82f6;
      transform: translateY(1px);
    }
  </style>
</head>
<body class="h-full bg-app-main text-app-text font-sans antialiased flex flex-col overflow-hidden select-none">

  <!-- 1. GNB 헤더 -->
  <header class="h-14 bg-app-panel border-b border-app-border flex items-center justify-between px-4 sm:px-6 z-20 flex-shrink-0">
    <!-- 브랜드 로고 & 타이틀 -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold text-base shadow-sm">
        M
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-semibold text-app-heading tracking-tight flex items-center gap-2">
          Markdown Studio
          <span class="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-app-border text-slate-400">Live</span>
        </h1>
      </div>
    </div>

    <!-- 모바일 전용 탭 전환 버튼 -->
    <div class="flex md:hidden items-center bg-app-main p-0.5 rounded-lg border border-app-border text-xs font-medium">
      <button id="mobile-tab-editor" class="px-3 py-1 rounded-md bg-app-panel text-white transition-all shadow-sm">
        Editor
      </button>
      <button id="mobile-tab-preview" class="px-3 py-1 rounded-md text-slate-400 hover:text-white transition-all">
        Preview
      </button>
    </div>

    <!-- 상단 툴바 액션 버튼 그룹 -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- 에디터 접기/펼치기 토글 버튼 -->
      <button id="btn-toggle-editor" title="에디터 패널 접기/펼치기" class="px-2.5 py-1.5 text-xs font-medium text-slate-300 hover:text-white bg-app-main hover:bg-[#252936] border border-app-border rounded-md transition-colors flex items-center gap-1.5">
        <svg id="icon-collapse" class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
        </svg>
        <span id="text-toggle-editor" class="hidden sm:inline">에디터 접기</span>
      </button>

      <div class="h-4 w-px bg-app-border mx-0.5"></div>

      <!-- 마크다운 이력 불러오기 -->
      <button id="btn-open-history" title="저장된 마크다운 이력 목록 (최대 100건)" class="px-2.5 py-1.5 text-xs font-medium text-slate-300 hover:text-white bg-app-main hover:bg-[#252936] border border-app-border rounded-md transition-colors flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span class="hidden sm:inline">이력 불러오기</span>
        <span id="badge-history-count" class="px-1.5 py-0.2 text-[10px] font-mono rounded-full bg-slate-800 text-amber-300 border border-slate-700">0</span>
      </button>

      <!-- 샘플 마크다운 불러오기 -->
      <button id="btn-load-sample" title="샘플 마크다운 불러오기" class="px-2.5 py-1.5 text-xs font-medium text-slate-300 hover:text-white bg-app-main hover:bg-[#252936] border border-app-border rounded-md transition-colors flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <span class="hidden sm:inline">샘플 불러오기</span>
      </button>

      <!-- 내용 지우기 -->
      <button id="btn-clear" title="에디터 내용 초기화" class="px-2.5 py-1.5 text-xs font-medium text-slate-300 hover:text-red-300 bg-app-main hover:bg-red-950/30 border border-app-border hover:border-red-900/50 rounded-md transition-colors flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
        <span class="hidden sm:inline">지우기</span>
      </button>

      <div class="h-4 w-px bg-app-border mx-0.5"></div>

      <!-- 클립보드 이미지 복사 -->
      <button id="btn-copy-img" title="프리뷰 화면을 클립보드에 이미지로 복사" class="px-2.5 py-1.5 text-xs font-medium text-slate-200 hover:text-white bg-app-main hover:bg-[#252936] border border-app-border rounded-md transition-colors flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
        </svg>
        <span class="hidden md:inline">이미지 복사</span>
      </button>

      <!-- PNG 다운로드 -->
      <button id="btn-download-png" title="고해상도 PNG 파일로 저장" class="px-2.5 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-500 rounded-md transition-colors flex items-center gap-1.5 shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
        <span>PNG 다운로드</span>
      </button>
    </div>
  </header>

  <!-- 2. 메인 컨텐츠 영역 (2-Pane Split View) -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- 좌측: 마크다운 입력창 (Editor Pane) -->
    <section id="pane-editor" class="w-full md:w-1/2 h-full flex flex-col bg-app-panel">
      <div class="h-9 px-4 flex items-center justify-between border-b border-app-border bg-app-panelAlt text-xs text-slate-400 select-none">
        <span class="flex items-center gap-2 font-mono font-medium">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
          </svg>
          EDITOR (MARKDOWN)
        </span>
        <div class="flex items-center gap-3">
          <span id="char-count" class="font-mono text-[11px] text-slate-500">0 chars</span>
          <span class="text-[11px] text-emerald-500 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            Auto-saved
          </span>
        </div>
      </div>
      <div class="flex-1 relative">
        <textarea
          id="editor-input"
          class="w-full h-full p-4 sm:p-5 bg-transparent text-slate-200 font-mono text-xs sm:text-[13px] leading-relaxed resize-none focus:outline-none placeholder-slate-600 select-text"
          placeholder="# 마크다운을 입력하세요...&#10;&#10;여기에 작성하는 모든 서식은 실시간으로 우측 프리뷰에 렌더링됩니다."
          spellcheck="false"
        ></textarea>
      </div>
    </section>

    <!-- 좌우 조절 리사이저 바 (Desktop 드래그 분할선) -->
    <div id="pane-resizer" class="hidden md:flex items-center justify-center w-1.5 hover:w-2 bg-app-border hover:bg-blue-500 active:bg-blue-600 cursor-col-resize z-20 transition-all duration-150 select-none flex-shrink-0 group" title="드래그하여 좌우 너비 조절 (더블클릭 시 5:5 복귀)">
      <div class="w-0.5 h-7 bg-slate-500 group-hover:bg-white rounded-full transition-colors pointer-events-none"></div>
    </div>

    <!-- 우측: 실시간 렌더링 뷰어 (Preview Pane) -->
    <section id="pane-preview" class="hidden md:flex flex-1 min-w-0 max-w-full h-full flex-col bg-app-panel overflow-hidden">
      <div class="h-9 px-4 flex items-center justify-between border-b border-app-border bg-app-panelAlt text-xs text-slate-400 select-none">
        <span class="flex items-center gap-2 font-mono font-medium">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
          </svg>
          PREVIEW
        </span>
        <span class="font-mono text-[11px] text-slate-500">Rendered with Marked + HLJS</span>
      </div>
      <!-- 스크롤 컨테이너 (여백을 슬림하게 축소하여 가로폭 최대 확보) -->
      <div id="preview-scroll-container" class="flex-1 min-w-0 max-w-full overflow-y-auto p-1.5 sm:p-3 select-text">
        <!-- 캡처 대상 노드 (상하좌우 패딩 최적화) -->
        <div id="preview-capture-node" class="w-full max-w-full min-w-0 p-2.5 sm:p-4 rounded-lg bg-[#1e212b] border border-app-border shadow-2xl transition-all">
          <div id="preview-render" class="min-w-0 max-w-full"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- 마크다운 이력 목록 모달 다이얼로그 -->
  <div id="modal-history" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4 select-none">
    <div class="w-full max-w-xl bg-app-panel border border-app-border rounded-xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
      <!-- 모달 헤더 -->
      <div class="px-5 py-3.5 border-b border-app-border flex items-center justify-between bg-app-panelAlt">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <h3 class="text-sm font-semibold text-white">마크다운 저장 이력</h3>
          <span id="modal-history-count" class="text-xs text-slate-400 font-mono">(0/100)</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-clear-all-history" title="모든 이력 삭제" class="px-2 py-1 text-[11px] text-slate-400 hover:text-red-400 hover:bg-red-950/30 rounded border border-transparent hover:border-red-900/40 transition-colors">
            전체 비우기
          </button>
          <button id="btn-close-history" title="닫기 (ESC)" class="p-1 text-slate-400 hover:text-white hover:bg-slate-800 rounded transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
      <!-- 모달 본문 (스크롤 리스트) -->

    const customRenderer = new marked.Renderer();
    const defaultCodeRenderer = customRenderer.code.bind(customRenderer);

    customRenderer.code = function(code, lang, escaped) {
      if (lang === 'mermaid') {
        const escapedCode = code
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
        return `<pre class="mermaid">${escapedCode}</pre>\n`;
      }
      return defaultCodeRenderer(code, lang, escaped);
    };

    marked.use({
      renderer: customRenderer,
      gfm: true,
      breaks: true,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try {
            return hljs.highlight(code, { language: lang }).value;
          } catch (e) {
            console.error(e);
          }
        }
        return hljs.highlightAuto(code).value;
      }
    });

    // --- Mermaid 다이어그램 비동기 렌더링 (공식 파이프라인) ---
    let mermaidRenderVersion = 0;
    async function renderMermaidDiagrams() {
      const version = ++mermaidRenderVersion;
      const elements = Array.from(previewRender.querySelectorAll('.mermaid'));

      for (const [index, element] of elements.entries()) {
        if (version !== mermaidRenderVersion) return;

        const source = element.dataset.mermaidSource || element.textContent;
        element.dataset.mermaidSource = source;
        element.classList.remove('mermaid-error');

        try {
          const renderId = `mermaid-${Date.now()}-${version}-${index}`;
          const { svg, bindFunctions } = await mermaid.render(renderId, source, element);
          if (version !== mermaidRenderVersion) return;

          element.innerHTML = svg;
          if (typeof bindFunctions === 'function') {
            bindFunctions(element);
          }
        } catch (error) {
          element.classList.add('mermaid-error');
          element.textContent = `Mermaid render error: ${error && error.message ? error.message : 'Unable to render Mermaid chart.'}`;
        }
      }
    }

    // --- 토스트 알림 표시 함수 ---

        icon.classList.add('text-red-400');

        icon.classList.add('text-emerald-400');

      toast.classList.remove('translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 2600);
    }

    // --- 코드 블록 복사 버튼 동적 주입 ---
    function injectCodeCopyButtons() {
      // Mermaid 다이어그램 블록(.mermaid)을 제외한 일반 코드 블록만 선택 (Mermaid 문법 파싱 오염 방지)
      const codeBlocks = previewRender.querySelectorAll('pre:not(.mermaid)');
      codeBlocks.forEach(pre => {
        // 이미 버튼이 있거나 내부에 code 요소가 없으면 스킵
        if (pre.querySelector('.btn-copy-code') || !pre.querySelector('code')) return;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn-copy-code absolute top-2 right-2 px-2 py-1 text-[11px] font-mono text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 rounded transition-all opacity-0 group-hover:opacity-100';
        copyBtn.innerText = 'Copy';
        copyBtn.setAttribute('title', '코드 복사');

        // 호버 시 버튼 표시용 클래스
        pre.classList.add('group');

        copyBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const codeEl = pre.querySelector('code');
          if (!codeEl) return;
          try {
            await navigator.clipboard.writeText(codeEl.innerText);
            copyBtn.innerText = 'Copied!';
            copyBtn.classList.add('text-emerald-400', 'border-emerald-500/50');
            setTimeout(() => {
              copyBtn.innerText = 'Copy';
              copyBtn.classList.remove('text-emerald-400', 'border-emerald-500/50');
            }, 1800);
          } catch (err) {
            showToast('코드 복사에 실패했습니다.', true);
          }
        });

        pre.appendChild(copyBtn);
      });
    }

    // --- 실시간 렌더링 및 로컬스토리지 이력 관리 ---
    const STORAGE_KEY = 'md_studio_content_v1';
    const HISTORY_STORAGE_KEY = 'md_studio_history_v1';
    const MAX_HISTORY_ITEMS = 100;
    let saveDebounceTimer = null;
    let historyDebounceTimer = null;

    function escapeHtml(text) {
      return (text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 마크다운 첫 줄에서 깔끔한 제목 추출
    function extractMarkdownTitle(md) {
      if (!md || !md.trim()) return '(빈 문서)';
      const lines = md.split('\n');
      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;
        const cleaned = line
          .replace(/^[#>\-\*\+\d\.\s]+/, '')
          .replace(/[\*\_`\[\]]/g, '')
          .trim();
        if (cleaned) {
          return cleaned.length > 50 ? cleaned.slice(0, 50) + '...' : cleaned;
        }
      }
      return '(제목 없음)';
    }

    // 히스토리 로드/저장/배지 업데이트
    function getHistoryList() {
      try {
        const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        console.warn('히스토리 로드 실패:', e);
        return [];
      }
    }

    function updateHistoryBadge(count) {
      if (badgeHistoryCount) badgeHistoryCount.textContent = count;
      if (modalHistoryCount) modalHistoryCount.textContent = `(${count}/${MAX_HISTORY_ITEMS})`;
    }

    function saveHistoryList(list) {
      try {
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(list));
        updateHistoryBadge(list.length);
      } catch (e) {
        // QuotaExceededError 발생 시 오래된 하위 항목 삭제 후 재시도
        if (list.length > 20) {
          list.splice(-20);
          try {
            localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(list));
            updateHistoryBadge(list.length);
          } catch (err) {}
        }
      }
    }

    // 마크다운 작성 시 히스토리에 FIFO(최대 100건) 자동 누적
    function recordHistoryAuto(content) {
      if (!content || !content.trim()) return;

      clearTimeout(historyDebounceTimer);
      historyDebounceTimer = setTimeout(() => {
        const list = getHistoryList();
        const title = extractMarkdownTitle(content);
        const now = Date.now();

        if (list.length > 0) {
          const top = list[0];
          // 완전 동일 내용이면 중복 저장 방지
          if (top.content === content) return;

          // 동일 제목으로 3분 이내 연속 편집 중이면 최신본으로 갱신 (파편화 방지)
          if (top.title === title && (now - top.updatedAt) < 3 * 60 * 1000) {
            top.content = content;
            top.length = content.length;
            top.updatedAt = now;
            saveHistoryList(list);
            return;
          }
        }

        // 신규 문서 혹은 다른 문서일 경우 최상단 추가
        list.unshift({
          id: 'hist_' + now,
          title,
          content,
          length: content.length,
          updatedAt: now
        });

        // 최대 100건 유지: 101번째(가장 오래된 마지막 항목) 자동 삭제 (FIFO)
        if (list.length > MAX_HISTORY_ITEMS) {
          list.splice(MAX_HISTORY_ITEMS);
        }

        saveHistoryList(list);
      }, 1500);
    }

    function renderMarkdown() {
      const rawMarkdown = editorInput.value;
      // 1. 파싱 및 새니타이즈
      const parsedHtml = marked.parse(rawMarkdown);
      const cleanHtml = DOMPurify.sanitize(parsedHtml, {
        USE_PROFILES: { html: true }
      });

      // 2. 프리뷰 DOM 업데이트
      previewRender.innerHTML = cleanHtml;
      injectCodeCopyButtons();
      renderMermaidDiagrams();

      // 3. 글자 수 갱신
      charCountEl.textContent = `${rawMarkdown.length.toLocaleString()} chars`;

      // 4. 로컬 스토리지 최신 작업본 저장 (300ms 디바운스)
      clearTimeout(saveDebounceTimer);
      saveDebounceTimer = setTimeout(() => {
        try {
          localStorage.setItem(STORAGE_KEY, rawMarkdown);
        } catch (e) {
          console.warn('LocalStorage 저장 실패:', e);
        }
      }, 300);

      // 5. 로컬스토리지 최대 100건 히스토리 자동 기록 (1.5초 디바운스)
      recordHistoryAuto(rawMarkdown);
    }

    // --- 스크롤 동기화 (Scroll Sync) ---
    let isEditorScrolling = false;
    let isPreviewScrolling = false;

    editorInput.addEventListener('scroll', () => {
      if (isPreviewScrolling) return;
      isEditorScrolling = true;

      const editorScrollable = editorInput.scrollHeight - editorInput.clientHeight;
      if (editorScrollable > 0) {
        const scrollRatio = editorInput.scrollTop / editorScrollable;
        const previewScrollable = previewScrollContainer.scrollHeight - previewScrollContainer.clientHeight;
        previewScrollContainer.scrollTop = scrollRatio * previewScrollable;
      }

      setTimeout(() => { isEditorScrolling = false; }, 50);
    });

    previewScrollContainer.addEventListener('scroll', () => {
      if (isEditorScrolling) return;
      isPreviewScrolling = true;

      const previewScrollable = previewScrollContainer.scrollHeight - previewScrollContainer.clientHeight;
      if (previewScrollable > 0) {
        const scrollRatio = previewScrollContainer.scrollTop / previewScrollable;
        const editorScrollable = editorInput.scrollHeight - editorInput.clientHeight;
        editorInput.scrollTop = scrollRatio * editorScrollable;
      }

      setTimeout(() => { isPreviewScrolling = false; }, 50);
    });

    // --- 모바일 탭 전환 ---
    function setupMobileTabs() {
      mobileTabEditor.addEventListener('click', () => {

        paneEditor.classList.add('hidden');

        mobileTabEditor.classList.remove('bg-app-panel', 'text-white');
        mobileTabEditor.classList.add('text-slate-400');
      });
    }

    // --- 에디터 접기/펼치기 토글 (Collapse / Expand) ---
    const btnToggleEditor = document.getElementById('btn-toggle-editor');
    const textToggleEditor = document.getElementById('text-toggle-editor');
    const iconCollapse = document.getElementById('icon-collapse');
    const COLLAPSE_STORAGE_KEY = 'md_studio_editor_collapsed_v1';
    let isEditorCollapsed = false;

    function setEditorCollapse(collapsed) {
      isEditorCollapsed = collapsed;
      if (isEditorCollapsed) {
        paneEditor.classList.add('hidden');
        paneResizer.classList.add('hidden');
        textToggleEditor.textContent = '에디터 펼치기';
        btnToggleEditor.title = '에디터 패널 펼치기';
        iconCollapse.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>';
        btnToggleEditor.classList.add('border-blue-500/50', 'text-blue-400');
      } else {
        paneEditor.classList.remove('hidden');
        paneResizer.classList.remove('hidden');
        textToggleEditor.textContent = '에디터 접기';
        btnToggleEditor.title = '에디터 패널 접기';
        iconCollapse.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>';
        btnToggleEditor.classList.remove('border-blue-500/50', 'text-blue-400');
      }
      try {
        localStorage.setItem(COLLAPSE_STORAGE_KEY, isEditorCollapsed ? 'true' : 'false');
      } catch (e) {}
    }

    if (btnToggleEditor) {
      btnToggleEditor.addEventListener('click', () => {
        setEditorCollapse(!isEditorCollapsed);
        showToast(isEditorCollapsed ? '에디터를 접었습니다 (프리뷰 전체화면)' : '에디터를 다시 펼쳤습니다.');
      });
    }

    // --- 패널 리사이저 (Drag to Resize) ---
    const paneResizer = document.getElementById('pane-resizer');
    const SPLIT_STORAGE_KEY = 'md_studio_split_ratio_v1';
    let isResizing = false;

    function setSplitRatio(percent) {
      const clamped = Math.min(Math.max(percent, 20), 80);
      paneEditor.style.width = `${clamped}%`;
      try {
        localStorage.setItem(SPLIT_STORAGE_KEY, clamped.toFixed(1));
      } catch (e) {}
    }

    function setupResizer() {
      if (!paneResizer) return;

      paneResizer.addEventListener('pointerdown', (e) => {
        isResizing = true;
        paneResizer.setPointerCapture(e.pointerId);
        document.body.classList.add('cursor-col-resize');
        paneEditor.style.transition = 'none';
      });

      window.addEventListener('pointermove', (e) => {
        if (!isResizing) return;
        const mainContainer = paneResizer.parentElement;
        const containerRect = mainContainer.getBoundingClientRect();
        const offsetX = e.clientX - containerRect.left;
        const percent = (offsetX / containerRect.width) * 100;
        setSplitRatio(percent);
      });

      window.addEventListener('pointerup', (e) => {
        if (!isResizing) return;
        isResizing = false;
        try {
          paneResizer.releasePointerCapture(e.pointerId);
        } catch (err) {}
        document.body.classList.remove('cursor-col-resize');
      });

      // 더블클릭 시 5:5 비율로 초기화
      paneResizer.addEventListener('dblclick', () => {
        setSplitRatio(50);
        showToast('패널 비율을 5:5로 초기화했습니다.');
      });

      // 저장된 분할 비율 복원
      const savedRatio = parseFloat(localStorage.getItem(SPLIT_STORAGE_KEY));
      if (!isNaN(savedRatio) && savedRatio >= 20 && savedRatio <= 80) {
        setSplitRatio(savedRatio);
      }
    }

    // --- 이미지 내보내기 공통 옵션 ---
    function getImageExportOptions() {
      return {
        pixelRatio: 2, // 고해상도 Retina 2x
        backgroundColor: '#1e212b',
        cacheBust: true,
        style: {
          margin: '0',
          padding: '16px'
        }
      };
    }

    // --- PNG 다운로드 핸들러 ---
    btnDownloadPng.addEventListener('click', async () => {
      const originalText = btnDownloadPng.innerHTML;
      btnDownloadPng.disabled = true;
      btnDownloadPng.innerHTML = `
        <svg class="animate-spin h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span>변환 중...</span>
      `;

      try {
        const dataUrl = await htmlToImage.toPng(previewCaptureNode, getImageExportOptions());
        const link = document.createElement('a');
        const timestamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
        link.download = `markdown-preview-${timestamp}.png`;
        link.href = dataUrl;
        link.click();
        showToast('고해상도 PNG 파일 다운로드가 완료되었습니다.');
      } catch (err) {
        console.error(err);
        showToast('PNG 변환 중 오류가 발생했습니다.', true);
      } finally {
        btnDownloadPng.disabled = false;
        btnDownloadPng.innerHTML = originalText;
      }
    });

    // --- 클립보드 이미지 복사 핸들러 ---
    btnCopyImg.addEventListener('click', async () => {
      const originalText = btnCopyImg.innerHTML;
      btnCopyImg.disabled = true;
      btnCopyImg.innerHTML = `
        <svg class="animate-spin h-3.5 w-3.5 text-slate-300" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span class="hidden md:inline">복사 중...</span>
      `;

      try {
        const blob = await htmlToImage.toBlob(previewCaptureNode, getImageExportOptions());
        if (!blob) throw new Error('Blob 생성 실패');

        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        showToast('클립보드에 이미지가 복사되었습니다! (Ctrl+V로 붙여넣기)');
      } catch (err) {
        console.error(err);
        showToast('클립보드 이미지 복사를 지원하지 않는 브라우저이거나 권한이 없습니다.', true);
      } finally {
        btnCopyImg.disabled = false;
        btnCopyImg.innerHTML = originalText;
      }
    });

    // --- 마크다운 이력 모달 제어 로직 ---
    function openHistoryModal() {
      renderHistoryModalList();
      modalHistory.classList.remove('hidden');
      modalHistory.classList.add('flex');
    }

    function closeHistoryModal() {
      modalHistory.classList.add('hidden');
      modalHistory.classList.remove('flex');
    }

    function renderHistoryModalList() {
      const list = getHistoryList();
      updateHistoryBadge(list.length);

      if (list.length === 0) {
        historyListContainer.innerHTML = `
          <div class="py-12 text-center text-slate-500 text-xs">
            <svg class="w-8 h-8 mx-auto mb-2 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            저장된 마크다운 이력이 없습니다.
          </div>
        `;
        return;
      }

      historyListContainer.innerHTML = list.map((item) => {
        const dateStr = new Date(item.updatedAt).toLocaleString('ko-KR', {
          month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        });
        const isCurrent = editorInput.value === item.content;
        return `
          <div data-id="${item.id}" class="btn-select-history group flex items-center justify-between p-2.5 rounded-lg border transition-all cursor-pointer ${
            isCurrent
              ? 'bg-blue-950/20 border-blue-500/40 hover:border-blue-500/60'
              : 'bg-app-main hover:bg-[#252936] border-app-border hover:border-slate-600'
          }">
            <div class="flex-1 min-w-0 pr-3">
              <div class="flex items-center gap-2">
                <span class="text-xs font-medium text-slate-200 group-hover:text-blue-300 truncate">${escapeHtml(item.title)}</span>
                ${isCurrent ? '<span class="px-1.5 py-0.2 text-[9px] bg-blue-500/20 text-blue-300 border border-blue-500/30 rounded">현재 작업본</span>' : ''}
              </div>
              <div class="flex items-center gap-3 mt-1 text-[11px] text-slate-500 font-mono">
                <span>${dateStr}</span>
                <span>•</span>
                <span>${item.length.toLocaleString()} chars</span>
              </div>
            </div>
            <button data-delete-id="${item.id}" title="이 항목 삭제" class="btn-delete-history opacity-0 group-hover:opacity-100 p-1 text-slate-500 hover:text-red-400 hover:bg-red-950/30 rounded transition-all">
              <svg class="w-3.5 h-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
          </div>
        `;
      }).join('');

      // 이력 선택 이벤트 바인딩
      historyListContainer.querySelectorAll('.btn-select-history').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.btn-delete-history')) return;
          selectHistoryItem(el.dataset.id);
        });
      });

      // 개별 이력 삭제 이벤트 바인딩
      historyListContainer.querySelectorAll('.btn-delete-history').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteHistoryItem(el.dataset.deleteId);
        });
      });
    }

    function selectHistoryItem(id) {
      const list = getHistoryList();
      const idx = list.findIndex(h => h.id === id);
      if (idx === -1) return;

      const [selected] = list.splice(idx, 1);
      selected.updatedAt = Date.now();
      // 최상단으로 재이동하여 가장 최근 본 md로 최신화
      list.unshift(selected);
      saveHistoryList(list);

      // 에디터 및 실시간 렌더링 동기화
      editorInput.value = selected.content;
      renderMarkdown();

      try {
        localStorage.setItem(STORAGE_KEY, selected.content);
      } catch (e) {}

      closeHistoryModal();
      showToast(`'${selected.title}' 이력을 불러왔습니다.`);
    }

    function deleteHistoryItem(id) {
      let list = getHistoryList();
      list = list.filter(h => h.id !== id);
      saveHistoryList(list);
      renderHistoryModalList();
      showToast('이력 항목을 삭제했습니다.');
    }

    // 모달 이벤트 리스너 설정
    if (btnOpenHistory) btnOpenHistory.addEventListener('click', openHistoryModal);
    if (btnCloseHistory) btnCloseHistory.addEventListener('click', closeHistoryModal);
    if (modalHistory) {
      modalHistory.addEventListener('click', (e) => {
        if (e.target === modalHistory) closeHistoryModal();
      });
    }
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalHistory && !modalHistory.classList.contains('hidden')) {
        closeHistoryModal();
      }
    });

    if (btnClearAllHistory) {
      btnClearAllHistory.addEventListener('click', () => {
        const list = getHistoryList();
        if (list.length === 0) return;
        if (confirm('저장된 모든 마크다운 이력을 삭제하시겠습니까?')) {
          saveHistoryList([]);
          renderHistoryModalList();
          showToast('모든 이력이 삭제되었습니다.');
        }
      });
    }

    // --- 샘플 불러오기 & 지우기 이벤트 ---
    btnLoadSample.addEventListener('click', () => {
      if (editorInput.value.trim().length > 0) {
        if (!confirm('현재 작성 중인 내용이 샘플 템플릿으로 대체됩니다. 계속할까요?')) {
          return;
        }
      }
      editorInput.value = SAMPLE_MARKDOWN;
      renderMarkdown();
      showToast('샘플 마크다운을 불러왔습니다.');
    });

    btnClear.addEventListener('click', () => {
      if (!editorInput.value.trim()) return;
      if (confirm('입력창의 모든 내용을 지우시겠습니까?')) {
        editorInput.value = '';
        renderMarkdown();
        showToast('내용을 모두 지웠습니다.');
      }
    });

    // --- 초기화 로직 ---
    function init() {
      // 키보드 탭키 입력 편의 (들여쓰기 2스페이스)
      editorInput.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = editorInput.selectionStart;
          const end = editorInput.selectionEnd;
          editorInput.value = editorInput.value.substring(0, start) + '  ' + editorInput.value.substring(end);
          editorInput.selectionStart = editorInput.selectionEnd = start + 2;
          renderMarkdown();
        }
      });

      // 입력 시 실시간 렌더링
      editorInput.addEventListener('input', renderMarkdown);

      // 모바일 탭 초기화
      setupMobileTabs();

      // 패널 리사이저 초기화
      setupResizer();

      // 에디터 접힘 상태 복원
      const savedCollapse = localStorage.getItem(COLLAPSE_STORAGE_KEY);
      if (savedCollapse === 'true' && window.innerWidth >= 768) {
        setEditorCollapse(true);
      }

      // 로컬 스토리지 복원
      const savedContent = localStorage.getItem(STORAGE_KEY);
      if (savedContent !== null && savedContent.length > 0) {
        editorInput.value = savedContent;
      } else {
        editorInput.value = SAMPLE_MARKDOWN;
      }

      // 히스토리 배지 카운트 초기 동기화
      const initialHistory = getHistoryList();
      updateHistoryBadge(initialHistory.length);

      renderMarkdown();
    }

    // DOM 준비 완료 시 구동
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
