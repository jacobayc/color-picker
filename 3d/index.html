<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Rig Showcase | Workspace Suite</title>

  <!-- 웹폰트: Pretendard & JetBrains Mono -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            app: {
              main: '#1a1d24',
              panel: '#1e212b',
              panelAlt: '#181a22',
              border: '#2d313f',
              borderHover: '#3e4456',
              text: '#cfd3dc',
              heading: '#f3f4f6',
              muted: '#7e8697'
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Three.js r147 UMD + OrbitControls (file:/// 100% 호환) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(71, 85, 105, 0.45) transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.65); }

    body {
      background-color: #1a1d24;
      color: #cfd3dc;
      font-family: 'Pretendard', sans-serif;
      overflow: hidden;
    }

    /* Range slider styling */
    input[type="range"].rig-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 9999px;
      background: #2d313f;
      outline: none;
    }
    input[type="range"].rig-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      border: 2px solid #0f172a;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
    }
    input[type="range"].rig-slider:disabled::-webkit-slider-thumb {
      background: #475569;
      cursor: not-allowed;
    }

    /* Resizer handle */
    .resizer-bar {
      width: 5px;
      cursor: col-resize;
      background: #2d313f;
      transition: background-color 0.15s ease;
      position: relative;
      z-index: 20;
    }
    .resizer-bar:hover,
    .resizer-bar.dragging {
      background: #38bdf8;
    }
  </style>
</head>
<body class="h-full flex flex-col antialiased">

  <!-- 상단 툴바 -->
  <header class="h-12 shrink-0 border-b border-app-border bg-app-panel flex items-center justify-between px-3 gap-2 z-30">
    <div class="flex items-center gap-2 min-w-0">

         class="flex items-center gap-1.5 px-2 py-1 rounded-md text-xs text-app-muted hover:text-white hover:bg-slate-800/70 transition-colors shrink-0">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        <span class="hidden sm:inline font-mono">Hub</span>
      </a>

      <div class="h-4 w-px bg-app-border shrink-0"></div>

      <div class="flex items-center gap-2 min-w-0">
        <div class="w-6 h-6 rounded-md bg-cyan-500/15 border border-cyan-500/30 text-cyan-400 flex items-center justify-center shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>

    <!-- 모바일 탭 전환 -->
    <div class="flex md:hidden items-center bg-app-panelAlt border border-app-border rounded-md p-0.5 text-xs">

      <button id="btn-mobile-view" class="px-2.5 py-1 rounded text-app-muted hover:text-white font-medium">3D View</button>

    <!-- 우측 액션 -->

          <button data-view="iso" class="cam-btn px-2 py-1 rounded text-[11px] font-mono font-medium bg-cyan-600/80 text-white transition-colors">Iso</button>
          <button data-view="front" class="cam-btn px-2 py-1 rounded text-[11px] font-mono text-app-text hover:text-white hover:bg-slate-700/70 transition-colors">Front (+Z)</button>
          <button data-view="back" class="cam-btn px-2 py-1 rounded text-[11px] font-mono text-app-text hover:text-white hover:bg-slate-700/70 transition-colors">Back (-Z)</button>
          <button data-view="left" class="cam-btn px-2 py-1 rounded text-[11px] font-mono text-app-text hover:text-white hover:bg-slate-700/70 transition-colors">Left</button>

          <div class="w-px h-4 bg-app-border mx-0.5"></div>
          <button id="btn-fit" title="모델 크기에 맞춰 카메라 정렬" class="px-2 py-1 rounded text-[11px] font-mono text-cyan-300 hover:text-white hover:bg-slate-700/70 transition-colors">Fit</button>

            </div>
            <div class="flex items-center justify-end gap-2">
              <span class="text-app-muted">Ground (y=0)</span>
              <span id="hud-ground" class="font-semibold text-emerald-400">-</span>

            <div class="flex items-center justify-end gap-2 text-app-text">

          <!-- CustomVehicleRig 실시간 동작 테스트 바 -->

        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-white">3D 모델 히스토리</span>
          <span id="modal-history-count" class="text-xs font-mono text-cyan-400">(0/1000)</span>
        </div>
        <div class="flex items-center gap-2 flex-1 sm:flex-initial justify-end">
          <input id="history-search" type="text" placeholder="모델명 / 함수명 검색..."

          <button id="btn-close-history" class="h-7 px-2.5 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs transition-colors">닫기</button>
        </div>
      </div>

      <div id="history-list-container" class="flex-1 overflow-y-auto p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 content-start"></div>
    </div>

  <!-- 토스트 알림 -->

  <script>
    // =========================================================================
    // 1. 기본 프리셋 코드 (CustomVehicleRig 협업 규약 준수)
    // =========================================================================
    const PRESETS = {
      cybertruck: `import * as THREE from 'three';

export interface CustomVehicleRig {
  group: THREE.Group;
  wheels: THREE.Object3D[];
  frontSteerPivots: THREE.Group[];
  headlightMat?: THREE.MeshStandardMaterial;
  taillightMat?: THREE.MeshStandardMaterial;
}

// - 이름/이모지: 사이버트럭 / 🛻
// - 좌석/지붕: 4인승 / 지붕 있음(hideAvatarInside: true)
// - 속도(크루즈/부스트): 80 / 155 km/h
// - 사운드: 전기차(ev)
// - 스폰 위치: 주차장 남쪽 빈칸
export function createCybertruck3D(): CustomVehicleRig {
  const group = new THREE.Group();

  // 1. 재질 설정 (곡면이 매끄럽게 보이도록 flatShading 제거 + 전 방향 색상 균일 글래스)
  const steelMat = new THREE.MeshStandardMaterial({
    color: 0xb8bec4,
    metalness: 0.72,
    roughness: 0.30,
  });
  const trimMat = new THREE.MeshStandardMaterial({
    color: 0x1f2226,
    metalness: 0.15,
    roughness: 0.85,
  });
  const bedMat = new THREE.MeshStandardMaterial({
    color: 0x16181c,
    metalness: 0.1,
    roughness: 0.92,
  });
  const tireMat = new THREE.MeshStandardMaterial({
    color: 0x18191b,
    metalness: 0.05,
    roughness: 0.9,
  });
  // 앞유리·천장유리·뒷유리·옆유리 모두 각도에 상관없이 동일한 톤으로 보이도록 설정
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x1b2430,
    emissive: 0x0a1017,
    emissiveIntensity: 0.55,
    metalness: 0.25,
    roughness: 0.22,
  });
  const plateMat = new THREE.MeshStandardMaterial({
    color: 0xd8dde3,
    metalness: 0.2,
    roughness: 0.5,
  });
  const headlightMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xeef7ff,
    emissiveIntensity: 1.4,
  });
  const taillightMat = new THREE.MeshStandardMaterial({
    color: 0x550000,
    emissive: 0xff1a1a,
    emissiveIntensity: 1.1,
  });

  const width = 1.96;
  const halfW = width / 2;

  // 전면부(차체·범퍼·라이트·유리)가 모두 공유하는 매끄러운 라운드 곡률 함수
  const getFrontBowOffset = (x: number): number => {
    const nx = Math.min(1, Math.abs(x) / halfW);
    return (1 - Math.cos(nx * Math.PI * 0.5)) * 0.38;
  };

  // 2. 다중 세그먼트(steps: 28) 기반 둥근 곡면 노즈 바디
  const bodyShape = new THREE.Shape();
  bodyShape.moveTo(2.40, 0.40);  // 전면 하단
  bodyShape.lineTo(2.46, 0.80);  // 전면 노즈 끝
  bodyShape.lineTo(2.26, 0.89);  // 전면 통유리 하단 시작점
  bodyShape.lineTo(0.16, 1.60);  // 루프 정점
  bodyShape.lineTo(-2.32, 1.16); // 테일게이트 상단
  bodyShape.lineTo(-2.38, 0.86); // 후면 꺾임
  bodyShape.lineTo(-2.30, 0.40); // 후면 하단
  bodyShape.closePath();

  const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
    depth: width,
    steps: 28, // 좌우 폭 방향을 28칸으로 쪼개어 곡선이 부드럽게 이어지도록 함
    bevelEnabled: false,
  });
  bodyGeo.translate(0, 0, -halfW);
  bodyGeo.rotateY(-Math.PI / 2);

  const posAttr = bodyGeo.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    let x = posAttr.getX(i);
    const y = posAttr.getY(i);
    let z = posAttr.getZ(i);
    const nx = Math.min(1, Math.abs(x) / halfW);

    // 1) 전면부 매끄러운 라운드 곡률 & 펜더 방향 자연스러운 테이퍼링
    if (z > 0.8) {
      const fFactor = Math.min(1, (z - 0.8) / 1.66);
      const smoothF = fFactor * fFactor * (3 - 2 * fFactor);
      z -= smoothF * getFrontBowOffset(x);
      x *= 1 - smoothF * Math.pow(nx, 2.2) * 0.065;
    }

    // 2) 측면 볼륨감(배럴 곡면) + 상단 캐빈 텀블홈 기울기
    if (y > 0.96) {
      const hFactor = Math.min(1, (y - 0.96) / 0.64);
      x *= 1 - hFactor * 0.08;
    }

    posAttr.setXYZ(i, x, y, z);
  }
  bodyGeo.computeVertexNormals();

  const bodyMesh = new THREE.Mesh(bodyGeo, steelMat);
  bodyMesh.castShadow = true;
  bodyMesh.receiveShadow = true;
  group.add(bodyMesh);

  // 적재함(Vault) 베드 & 좌우 세일 필러 레일
  const bedFloor = new THREE.Mesh(
    new THREE.BoxGeometry(width - 0.38, 0.04, 1.38),
    bedMat
  );
  bedFloor.position.set(0, 1.11, -1.52);
  bedFloor.rotation.x = 0.175;
  group.add(bedFloor);

  for (const side of [-1, 1]) {
    const sailRail = new THREE.Mesh(
      new THREE.BoxGeometry(0.11, 0.07, 1.98),
      steelMat
    );
    sailRail.position.set(side * (halfW - 0.12), 1.28, -1.24);
    sailRail.rotation.x = 0.175;
    group.add(sailRail);
  }

  // 3. 각지지 않고 옆면까지 곡선으로 부드럽게 감싸는 일체형 전면 범퍼 & 하부 섀시
  const lowerChassis = new THREE.Mesh(
    new THREE.BoxGeometry(width + 0.02, 0.16, 4.46),
    trimMat
  );
  lowerChassis.position.set(0, 0.36, -0.06);
  group.add(lowerChassis);

  // 전면 범퍼를 32세그먼트 단일 곡면 메쉬로 생성해 옆으로 매끄럽게 감싸도록 처리
  const frontBumperGeo = new THREE.BoxGeometry(width + 0.05, 0.23, 0.26, 32, 1, 4);
  const fbPos = frontBumperGeo.attributes.position;
  for (let i = 0; i < fbPos.count; i++) {
    let bx = fbPos.getX(i);
    let bz = fbPos.getZ(i);
    const nx = Math.min(1, Math.abs(bx) / (halfW + 0.025));
    bz -= getFrontBowOffset(bx) * 1.05;
    bx *= 1 - Math.pow(nx, 2.2) * 0.06;
    fbPos.setXYZ(i, bx, fbPos.getY(i), bz);
  }
  frontBumperGeo.computeVertexNormals();

  const frontBumper = new THREE.Mesh(frontBumperGeo, trimMat);
  frontBumper.position.set(0, 0.44, 2.34);
  group.add(frontBumper);

  // 번호판도 전면 곡면에 맞춰 살짝 라운드 처리
  const plateGeo = new THREE.BoxGeometry(0.50, 0.11, 0.03, 12, 1, 1);
  const pPos = plateGeo.attributes.position;
  for (let i = 0; i < pPos.count; i++) {
    const px = pPos.getX(i);
    pPos.setZ(i, pPos.getZ(i) - getFrontBowOffset(px));
  }
  plateGeo.computeVertexNormals();
  const licensePlate = new THREE.Mesh(plateGeo, plateMat);
  licensePlate.position.set(0, 0.45, 2.47);
  group.add(licensePlate);

  // 곡면 스키드 플레이트
  const skidGeo = new THREE.BoxGeometry(1.46, 0.10, 0.28, 20, 1, 1);
  const sPos = skidGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    const sx = sPos.getX(i);
    sPos.setZ(i, sPos.getZ(i) - getFrontBowOffset(sx));
  }
  skidGeo.computeVertexNormals();
  const skidPlate = new THREE.Mesh(skidGeo, trimMat);
  skidPlate.position.set(0, 0.31, 2.30);
  skidPlate.rotation.x = -0.32;
  group.add(skidPlate);

  const rearBumper = new THREE.Mesh(
    new THREE.BoxGeometry(width + 0.04, 0.24, 0.24),
    trimMat
  );
  rearBumper.position.set(0, 0.45, -2.32);
  group.add(rearBumper);

  const towHitch = new THREE.Mesh(
    new THREE.BoxGeometry(0.16, 0.12, 0.14),
    trimMat
  );
  towHitch.position.set(0, 0.34, -2.41);
  group.add(towHitch);

  // 4. 끊김 없이 옆 펜더까지 곡선으로 이어지는 일체형 DRL 라이트 바 & 로우빔
  const drlGeo = new THREE.BoxGeometry(width - 0.04, 0.048, 0.06, 32, 1, 1);
  const dPos = drlGeo.attributes.position;
  for (let i = 0; i < dPos.count; i++) {
    let dx = dPos.getX(i);
    let dz = dPos.getZ(i);
    const nx = Math.min(1, Math.abs(dx) / halfW);
    dz -= getFrontBowOffset(dx);
    dx *= 1 - Math.pow(nx, 2.2) * 0.065;
    dPos.setXYZ(i, dx, dPos.getY(i), dz);
  }
  drlGeo.computeVertexNormals();

  const frontLightBar = new THREE.Mesh(drlGeo, headlightMat);
  frontLightBar.position.set(0, 0.80, 2.45);
  group.add(frontLightBar);

  // 라이트 바 바로 위를 감싸는 곡면 불노즈 처마(눈썹)
  const browGeo = new THREE.BoxGeometry(width - 0.02, 0.038, 0.09, 32, 1, 1);
  const brPos = browGeo.attributes.position;
  for (let i = 0; i < brPos.count; i++) {
    let bx = brPos.getX(i);
    let bz = brPos.getZ(i);
    const nx = Math.min(1, Math.abs(bx) / halfW);
    bz -= getFrontBowOffset(bx);
    bx *= 1 - Math.pow(nx, 2.2) * 0.065;
    brPos.setXYZ(i, bx, brPos.getY(i), bz);
  }
  browGeo.computeVertexNormals();
  const browLip = new THREE.Mesh(browGeo, steelMat);
  browLip.position.set(0, 0.835, 2.44);
  group.add(browLip);

  const rearLight = new THREE.Mesh(
    new THREE.BoxGeometry(width - 0.12, 0.04, 0.05),

  );
  rearLight.position.set(0, 0.96, -2.35);
  group.add(rearLight);

  // 5. 앞유리 + 천장 루프 유리 + 뒷유리 + 옆유리 (모두 동일한 glassMat & 곡면 일체화)
  // (1) 전면 풀-스윕 통유리 (하단 노즈 곡률을 따라 둥글게 시작해 루프 정점까지 연결)
  const dzGlass = 2.06;
  const dyGlass = 0.70;
  const fullGlassLen = Math.hypot(dzGlass, dyGlass);
  const fullGlassAngle = Math.atan2(dyGlass, dzGlass);

  const windshieldGeo = new THREE.BoxGeometry(1.66, 0.028, fullGlassLen, 24, 1, 16);
  const wPos = windshieldGeo.attributes.position;
  for (let i = 0; i < wPos.count; i++) {
    let wx = wPos.getX(i);
    const wy = wPos.getY(i);
    let wz = wPos.getZ(i);
    // wz: +fullGlassLen/2 (전면 하단) ~ -fullGlassLen/2 (루프 상단)
    const tFront = (wz + fullGlassLen / 2) / fullGlassLen; // 0(루프 상단) ~ 1(전면 하단)
    const topRatio = 1 - tFront;
    wx *= 1 - topRatio * 0.075;
    // 전면 하단으로 갈수록 노즈 곡률에 맞춰 부드럽게 라운딩
    wz -= Math.pow(tFront, 1.5) * getFrontBowOffset(wx) * 0.78;
    wPos.setXYZ(i, wx, wy, wz);
  }
  windshieldGeo.computeVertexNormals();

  const windshield = new THREE.Mesh(windshieldGeo, glassMat);
  windshield.position.set(0, 1.252, 1.20);
  windshield.rotation.x = fullGlassAngle;
  group.add(windshield);

  // (2) 천장 파노라믹 루프 유리 (루프 정점 z=0.16 -> 뒷좌석 끝 z=-0.92까지 이어지는 통유리 천장)
  const roofDz = 1.08;
  const roofDy = 0.188;
  const roofLen = Math.hypot(roofDz, roofDy);
  const roofAngle = Math.atan2(roofDy, roofDz);

  const roofGlass = new THREE.Mesh(
    new THREE.BoxGeometry(1.52, 0.028, roofLen),
    glassMat
  );
  roofGlass.position.set(0, 1.508, -0.37);
  roofGlass.rotation.x = -roofAngle;
  group.add(roofGlass);

  // (3) 뒷유리 (캐빈 후면 격벽 글래스)
  const rearWindow = new THREE.Mesh(
    new THREE.BoxGeometry(1.50, 0.30, 0.025),
    glassMat
  );
  rearWindow.position.set(0, 1.28, -0.90);
  rearWindow.rotation.x = -0.12;

  // 기가 와이퍼

  );
  wiper.position.set(-0.68, 1.275, 1.12);
  wiper.rotation.x = fullGlassAngle;
  wiper.rotation.y = 0.05;
  group.add(wiper);

  // (4) 측면 2분할 창문 (앞유리·천장유리와 동일한 glassMat 적용)
  const frontWinShape = new THREE.Shape();

  rearWinShape.closePath();

  const rearWinGeo = new THREE.ExtrudeGeometry(rearWinShape, {
    depth: 0.02,
    bevelEnabled: false,
  });
  rearWinGeo.translate(0, 0, -0.01);
  rearWinGeo.rotateY(-Math.PI / 2);

  const doorSeamPositions = [
    { z: 0.94, h: 0.56, y: 0.70 },
    { z: 0.09, h: 0.56, y: 0.70 },
    { z: -0.88, h: 0.54, y: 0.71 },
  ];

  for (const side of [-1, 1]) {
    const fWin = new THREE.Mesh(frontWinGeo, glassMat);
    fWin.position.set(side * (halfW - 0.022), 0, 0);
    fWin.rotation.z = side * 0.12;
    group.add(fWin);

    const rWin = new THREE.Mesh(rearWinGeo, glassMat);
    rWin.position.set(side * (halfW - 0.022), 0, 0);
    rWin.rotation.z = side * 0.12;
    group.add(rWin);

    // 도어 패널 갭 라인
    for (const seam of doorSeamPositions) {
      const seamLine = new THREE.Mesh(
        new THREE.BoxGeometry(0.012, seam.h, 0.012),
        trimMat
      );
      seamLine.position.set(side * (halfW + 0.002), seam.y, seam.z);
      group.add(seamLine);
    }

    // 삼각 사이드 미러
    const mirrorArm = new THREE.Mesh(
      new THREE.BoxGeometry(0.16, 0.03, 0.06),
      trimMat
    );
    mirrorArm.position.set(side * (halfW + 0.04), 1.04, 1.22);
    group.add(mirrorArm);

    const mirrorHead = new THREE.Mesh(
      new THREE.ConeGeometry(0.088, 0.19, 3),
      trimMat
    );
    mirrorHead.rotation.z = side * (Math.PI / 2);
    mirrorHead.rotation.y = side * 0.25;
    mirrorHead.position.set(side * (halfW + 0.14), 1.05, 1.20);
    group.add(mirrorHead);
  }

  // 6. 사다리꼴 각진 휠 아치 + 7스포크 에어로 휠 커버
  const archShape = new THREE.Shape();
  archShape.moveTo(-0.60, 0);
  archShape.lineTo(-0.39, 0.39);
  archShape.lineTo(0.39, 0.39);
  archShape.lineTo(0.60, 0);
  archShape.lineTo(0.47, 0);
  archShape.lineTo(0.31, 0.27);
  archShape.lineTo(-0.31, 0.27);
  archShape.lineTo(-0.47, 0);
  archShape.closePath();

  const archGeo = new THREE.ExtrudeGeometry(archShape, {
    depth: 0.20,
    bevelEnabled: false,
  });
  archGeo.translate(0, 0, -0.10);
  archGeo.rotateY(-Math.PI / 2);

  const tireGeo = new THREE.CylinderGeometry(0.39, 0.39, 0.30, 28);
  tireGeo.rotateZ(Math.PI / 2);

  const aeroPlateGeo = new THREE.CylinderGeometry(0.26, 0.27, 0.315, 7);
  aeroPlateGeo.rotateZ(Math.PI / 2);

  const aeroWingGeo = new THREE.BoxGeometry(0.325, 0.068, 0.36);
  const centerHexGeo = new THREE.CylinderGeometry(0.09, 0.10, 0.34, 7);
  centerHexGeo.rotateZ(Math.PI / 2);

  const wheels: THREE.Object3D[] = [];
  const frontSteerPivots: THREE.Group[] = [];
  const wheelPositions: Array<{ x: number; z: number; isFront: boolean }> = [
    { x: -1.00, z: 1.48, isFront: true },
    { x: 1.00, z: 1.48, isFront: true },
    { x: -1.00, z: -1.50, isFront: false },
    { x: 1.00, z: -1.50, isFront: false },
  ];

  for (const pos of wheelPositions) {
    const arch = new THREE.Mesh(archGeo, trimMat);
    arch.position.set(pos.x > 0 ? 1.00 : -1.00, 0.43, pos.z);
    group.add(arch);

    const steerPivot = new THREE.Group();
    steerPivot.position.set(pos.x, 0.39, pos.z);

    const wheelSpin = new THREE.Group();
    const tire = new THREE.Mesh(tireGeo, tireMat);
    const aeroPlate = new THREE.Mesh(aeroPlateGeo, trimMat);
    const centerHex = new THREE.Mesh(centerHexGeo, trimMat);
    tire.castShadow = true;
    wheelSpin.add(tire, aeroPlate, centerHex);

    for (let i = 0; i < 7; i++) {
      const wing = new THREE.Mesh(aeroWingGeo, trimMat);
      wing.rotation.x = (i * Math.PI * 2) / 7;
      wheelSpin.add(wing);

    group.add(steerPivot);
    wheels.push(wheelSpin);
    if (pos.isFront) frontSteerPivots.push(steerPivot);
  }

  return { group, wheels, frontSteerPivots, headlightMat, taillightMat };
}`,

// - 속도(크루즈/부스트): 90 / 160 km/h

export function createCustomVehicle3D(): CustomVehicleRig {
  const group = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, metalness: 0.4, roughness: 0.35 });
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 });
  const headlightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xeef7ff, emissiveIntensity: 1.2 });
  const taillightMat = new THREE.MeshStandardMaterial({ color: 0x660000, emissive: 0xff2222, emissiveIntensity: 1.0 });

  // 차체 (+Z가 전방)
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.65, 3.8), bodyMat);
  body.position.set(0, 0.65, 0);
  body.castShadow = true;
  group.add(body);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.5, 1.9), bodyMat);
  cabin.position.set(0, 1.2, -0.2);
  cabin.castShadow = true;
  group.add(cabin);

  // 전조등 / 후미등
  const hl = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.08, 0.06), headlightMat);
  hl.position.set(0, 0.68, 1.90);
  group.add(hl);

  const tl = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.08, 0.06), taillightMat);
  tl.position.set(0, 0.68, -1.90);
  group.add(tl);

  // 바퀴 (반지름 0.35 -> y=0.35로 지면 y=0 정렬)
  const tireGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.24, 18);
  tireGeo.rotateZ(Math.PI / 2);

  const wheels: THREE.Object3D[] = [];
  const frontSteerPivots: THREE.Group[] = [];

  for (const p of [
    { x: -0.88, z: 1.2, f: true },
    { x: 0.88, z: 1.2, f: true },
    { x: -0.88, z: -1.2, f: false },
    { x: 0.88, z: -1.2, f: false },
  ]) {
    const pivot = new THREE.Group();
    pivot.position.set(p.x, 0.35, p.z);
    const spin = new THREE.Group();
    const tire = new THREE.Mesh(tireGeo, wheelMat);
    tire.castShadow = true;
    spin.add(tire);
    pivot.add(spin);
    group.add(pivot);
    wheels.push(spin);
    if (p.f) frontSteerPivots.push(pivot);
  }

  return { group, wheels, frontSteerPivots, headlightMat, taillightMat };
}`

      const parts = [];

        statusMsg.textContent = `✕ 오류: ${err.message}`;
        statusMsg.className = 'truncate text-rose-400';
      }

    function updateRigControlsUI(rig) {
      const badges = [];
      const hasWheels = rig.wheels.length > 0;
      const hasSteer = rig.frontSteerPivots.length > 0;
      const hasHL = Boolean(rig.headlightMat);
      const hasTL = Boolean(rig.taillightMat);

      badges.push(makeBadge(`wheels: ${rig.wheels.length}`, hasWheels));
      badges.push(makeBadge(`steer: ${rig.frontSteerPivots.length}`, hasSteer));
      badges.push(makeBadge('headlight', hasHL));
      badges.push(makeBadge('taillight', hasTL));

      document.getElementById('hud-rig-badges').innerHTML = badges.join('');

      document.getElementById('btn-rig-spin').disabled = !hasWheels;
      document.getElementById('slider-rig-steer').disabled = !hasSteer;
      document.getElementById('btn-rig-headlight').disabled = !hasHL;
      document.getElementById('btn-rig-brake').disabled = !hasTL;

    function makeBadge(label, active) {
      return active
        ? `<span class="px-1.5 py-0.5 rounded bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-[10px] font-mono">${label}</span>`
        : `<span class="px-1.5 py-0.5 rounded bg-slate-800/80 border border-slate-700/60 text-slate-500 text-[10px] font-mono">${label}</span>`;
    }

    // =========================================================================
    // 5. 카메라 6방향 + Iso 프리셋 전환
    // =========================================================================
    function setCameraPreset(view, instant = false) {
      const dist = modelRadius * 2.35;
      const target = modelCenter.clone();
      let dir;

      switch (view) {
        case 'front':  dir = new THREE.Vector3(0, 0.12, 1); break;
        case 'back':   dir = new THREE.Vector3(0, 0.12, -1); break;
        case 'left':   dir = new THREE.Vector3(-1, 0.1, 0); break;
        case 'right':  dir = new THREE.Vector3(1, 0.1, 0); break;
        case 'top':    dir = new THREE.Vector3(0, 1, 0.001); break;
        case 'bottom': dir = new THREE.Vector3(0, -1, 0.001); break;
        case 'iso':
        default:       dir = new THREE.Vector3(0.75, 0.42, 0.82); break;
      }

      dir.normalize();
      const destPos = target.clone().addScaledVector(dir, dist);

      // 버튼 활성화 스타일
      document.querySelectorAll('.cam-btn').forEach((btn) => {
        const isActive = btn.dataset.view === view;
        btn.className = isActive
          ? 'cam-btn px-2 py-1 rounded text-[11px] font-mono font-medium bg-cyan-600/80 text-white transition-colors'
          : 'cam-btn px-2 py-1 rounded text-[11px] font-mono text-app-text hover:text-white hover:bg-slate-700/70 transition-colors';
      });

      if (instant) {
        camera.position.copy(destPos);
        controls.target.copy(target);
        controls.update();
        camTween = null;
      } else {
        camTween = {
          startPos: camera.position.clone(),
          endPos: destPos,
          startTarget: controls.target.clone(),
          endTarget: target,
          progress: 0,
        };
      }
    }

    document.getElementById('btn-rig-headlight').addEventListener('click', (e) => {

    // =========================================================================
    // 7. Split Pane 리사이저 & 에디터 토글 & 반응형 리사이즈
    // =========================================================================
    const paneEditor = document.getElementById('pane-editor');
    const paneViewport = document.getElementById('pane-viewport');
    const resizer = document.getElementById('resizer');
    let editorCollapsed = false;

    function handleResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w > 0 && h > 0) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
    }
    window.addEventListener('resize', handleResize);

    // 드래그 리사이저 (20% ~ 80%)
    let isDragging = false;
    resizer.addEventListener('mousedown', () => {
      isDragging = true;
      resizer.classList.add('dragging');
      document.body.style.userSelect = 'none';
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const pct = Math.min(80, Math.max(20, (e.clientX / window.innerWidth) * 100));
      paneEditor.style.width = `${pct}%`;
      handleResize();
    });
    window.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      resizer.classList.remove('dragging');
      document.body.style.userSelect = '';
    });

    function toggleEditorPane() {
      editorCollapsed = !editorCollapsed;
      paneEditor.classList.toggle('md:hidden', editorCollapsed);
      resizer.classList.toggle('md:hidden', editorCollapsed);
      handleResize();
    }
    document.getElementById('btn-toggle-editor').addEventListener('click', toggleEditorPane);
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
        e.preventDefault();
        toggleEditorPane();
      }
    });

    // 모바일 탭 전환
    const btnMobEd = document.getElementById('btn-mobile-editor');
    const btnMobView = document.getElementById('btn-mobile-view');
    btnMobEd.addEventListener('click', () => {
      paneEditor.classList.remove('hidden');
      paneViewport.classList.add('hidden');
      paneViewport.classList.remove('flex');
      btnMobEd.className = 'px-2.5 py-1 rounded text-white bg-slate-700/80 font-medium';
      btnMobView.className = 'px-2.5 py-1 rounded text-app-muted hover:text-white font-medium';
    });
    btnMobView.addEventListener('click', () => {
      paneEditor.classList.add('hidden');
      paneViewport.classList.remove('hidden');
      paneViewport.classList.add('flex');
      btnMobView.className = 'px-2.5 py-1 rounded text-white bg-slate-700/80 font-medium';
      btnMobEd.className = 'px-2.5 py-1 rounded text-app-muted hover:text-white font-medium';
      requestAnimationFrame(handleResize);
    });

    // 렌더 루프
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);

      // 카메라 프리셋 부드러운 보간
      if (camTween) {
        camTween.progress = Math.min(1, camTween.progress + dt * 4.5);
        const t = 1 - Math.pow(1 - camTween.progress, 3); // cubic ease-out
        camera.position.lerpVectors(camTween.startPos, camTween.endPos, t);
        controls.target.lerpVectors(camTween.startTarget, camTween.endTarget, t);
        if (camTween.progress >= 1) camTween = null;
      }

      // 바퀴 구름 회전 (wheels[i].rotation.x += ...)
      if (state.wheelSpin && currentRig && currentRig.wheels.length > 0) {
        for (const w of currentRig.wheels) {
          if (w && w.rotation) w.rotation.x += dt * 6.0;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // =========================================================================
    // 8. IndexedDB 3D 모델 히스토리 (최대 1,000건 + 240x150 썸네일 미리보기)
    // =========================================================================
    const DB_NAME = 'RigShowcaseDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'history';
    const MAX_HISTORY_ITEMS = 1000;
    let dbPromise = null;
    let cachedHistoryList = [];
    let historyAutoTimer = null;

    function openHistoryDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve) => {
          if (!('indexedDB' in window)) {
            resolve(null);
            return;
          }
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
              store.createIndex('updatedAt', 'updatedAt', { unique: false });
            }
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = () => resolve(null);
        });
      }
      return dbPromise;
    }

    async function initHistoryStore() {
      const db = await openHistoryDB();
      if (db) {
        try {
          const list = await new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          });
          list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
          cachedHistoryList = list.slice(0, MAX_HISTORY_ITEMS);
        } catch (e) {
          cachedHistoryList = [];
        }
      }
      updateHistoryBadges();
    }

    async function putHistoryItemDB(item) {
      const db = await openHistoryDB();
      if (!db) return;
      try {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(item);
      } catch (e) {}
    }

    async function deleteHistoryIdsDB(ids) {
      if (!ids || ids.length === 0) return;
      const db = await openHistoryDB();
      if (!db) return;
      try {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        ids.forEach((id) => store.delete(id));
      } catch (e) {}
    }

    async function clearHistoryDB() {
      const db = await openHistoryDB();
      if (!db) return;
      try {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
      } catch (e) {}
    }

    function updateHistoryBadges() {
      const count = cachedHistoryList.length;
      document.getElementById('badge-history-count').textContent = count;
      document.getElementById('modal-history-count').textContent = `(${count}/${MAX_HISTORY_ITEMS})`;
    }

    function extractModelTitle(code, fnName) {
      const memoMatch = code.match(/이름\/이모지\s*:\s*([^\r\n]+)/);
      if (memoMatch && memoMatch[1].trim()) {
        const parts = memoMatch[1].split('/').map((s) => s.trim()).filter(Boolean);
        if (parts.length >= 2) return `${parts[1]} ${parts[0]}`;
        if (parts[0]) return parts[0];
      }
      if (fnName && fnName !== 'snippet') return fnName;
      return '3D Model Snippet';
    }

    function captureThumbnailDataUrl() {
      try {
        renderer.render(scene, camera);
        const src = renderer.domElement;
        if (!src || src.width === 0 || src.height === 0) return '';
        const tw = 240;
        const th = 150;
        const off = document.createElement('canvas');
        off.width = tw;
        off.height = th;
        const ctx = off.getContext('2d');
        ctx.fillStyle = '#14171f';
        ctx.fillRect(0, 0, tw, th);

        // Aspect-cover 크롭으로 모델 중심을 깔끔하게 캡처
        const srcRatio = src.width / src.height;
        const dstRatio = tw / th;
        let sx = 0, sy = 0, sw = src.width, sh = src.height;
        if (srcRatio > dstRatio) {
          sw = src.height * dstRatio;
          sx = (src.width - sw) / 2;
        } else {
          sh = src.width / dstRatio;
          sy = (src.height - sh) / 2;
        }
        ctx.drawImage(src, sx, sy, sw, sh, 0, 0, tw, th);
        return off.toDataURL('image/jpeg', 0.72);
      } catch (e) {
        return '';
      }
    }

    function scheduleHistoryAutoSave(codeSnapshot) {
      clearTimeout(historyAutoTimer);
      historyAutoTimer = setTimeout(() => {
        if (editorEl.value !== codeSnapshot || !lastRenderOk) return;
        saveHistorySnapshot(false);
      }, 1400);
    }

    async function saveHistorySnapshot(manual = false) {
      const code = editorEl.value;
      if (!code || !code.trim()) {
        if (manual) showToast('저장할 코드가 비어 있습니다');
        return;
      }
      if (!lastRenderOk) {
        if (manual) showToast('오류가 없는 코드만 저장할 수 있습니다');
        return;
      }

      const now = Date.now();
      const title = extractModelTitle(code, lastMeta.fnName);
      const thumbnail = captureThumbnailDataUrl();

      if (cachedHistoryList.length > 0) {
        const top = cachedHistoryList[0];
        if (top.code === code) {
          // 동일 코드면 썸네일/시각만 최신화
          top.thumbnail = thumbnail || top.thumbnail;
          top.updatedAt = now;
          await putHistoryItemDB(top);
          updateHistoryBadges();
          if (manual) showToast('현재 모델 이력 갱신됨');
          return;
        }
        // 자동 저장 시 3분 이내 동일 모델명 수정은 새 항목 대신 병합
        if (!manual && top.title === title && now - top.updatedAt < 3 * 60 * 1000) {
          top.code = code;
          top.thumbnail = thumbnail || top.thumbnail;
          top.sizeText = lastMeta.sizeText;
          top.tris = lastMeta.tris;
          top.updatedAt = now;
          await putHistoryItemDB(top);
          updateHistoryBadges();
          return;
        }
      }

      const newItem = {
        id: `rig_${now}_${Math.random().toString(36).slice(2, 6)}`,
        title,
        fnName: lastMeta.fnName,
        sizeText: lastMeta.sizeText,
        tris: lastMeta.tris,
        thumbnail,
        code,
        updatedAt: now,
      };

      cachedHistoryList.unshift(newItem);
      await putHistoryItemDB(newItem);

      if (cachedHistoryList.length > MAX_HISTORY_ITEMS) {
        const removed = cachedHistoryList.splice(MAX_HISTORY_ITEMS);
        await deleteHistoryIdsDB(removed.map((it) => it.id));
      }

      updateHistoryBadges();
      if (manual) showToast(`스냅샷 저장 완료 (${cachedHistoryList.length}/${MAX_HISTORY_ITEMS})`);
    }

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatTime(ts) {
      const d = new Date(ts);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function renderHistoryModalList() {
      const containerEl = document.getElementById('history-list-container');
      const query = (document.getElementById('history-search').value || '').trim().toLowerCase();
      const filtered = query
        ? cachedHistoryList.filter((it) =>
            (it.title || '').toLowerCase().includes(query) ||
            (it.fnName || '').toLowerCase().includes(query) ||
            (it.code || '').toLowerCase().includes(query)
          )
        : cachedHistoryList;

      if (filtered.length === 0) {
        containerEl.innerHTML = `
          <div class="col-span-full py-16 text-center text-xs text-app-muted">
            ${cachedHistoryList.length === 0
              ? '아직 저장된 모델 이력이 없습니다.<br/>코드를 수정·실행하거나 상단 [💾 저장] 버튼을 누르면 썸네일과 함께 자동 보관됩니다.'
              : '검색 조건과 일치하는 모델 이력이 없습니다.'}
          </div>`;
        return;
      }

      containerEl.innerHTML = filtered.map((it) => `
        <div data-id="${escapeHtml(it.id)}"
             class="history-card group rounded-lg bg-app-main border border-app-border hover:border-cyan-500/60 overflow-hidden cursor-pointer transition-all flex flex-col">
          <div class="relative aspect-[16/10] bg-[#14171f] overflow-hidden border-b border-app-border">
            ${it.thumbnail
              ? `<img src="${it.thumbnail}" alt="${escapeHtml(it.title)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200" />`
              : `<div class="w-full h-full flex items-center justify-center text-xs font-mono text-app-muted">No Preview</div>`}
            <button data-del-id="${escapeHtml(it.id)}" title="이력 삭제"
                    class="btn-del-history absolute top-1.5 right-1.5 w-6 h-6 rounded bg-black/65 hover:bg-rose-600 text-slate-300 hover:text-white text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">✕</button>
          </div>
          <div class="p-2.5 flex-1 flex flex-col justify-between gap-1.5">
            <div class="text-xs font-semibold text-white truncate">${escapeHtml(it.title)}</div>
            <div class="flex items-center justify-between text-[10px] font-mono text-app-muted">
              <span>${escapeHtml(it.sizeText || '-')}</span>
              <span>${Number(it.tris || 0).toLocaleString()} tris</span>
            </div>
            <div class="text-[10px] font-mono text-slate-500">${formatTime(it.updatedAt)}</div>
          </div>
        </div>
      `).join('');
    }

    const modalHistory = document.getElementById('modal-history');
    function openHistoryModal() {
      renderHistoryModalList();
      modalHistory.classList.remove('hidden');
      document.getElementById('history-search').focus();
    }
    function closeHistoryModal() {
      modalHistory.classList.add('hidden');
    }

    document.getElementById('btn-open-history').addEventListener('click', openHistoryModal);
    document.getElementById('btn-close-history').addEventListener('click', closeHistoryModal);
    modalHistory.addEventListener('click', (e) => {
      if (e.target === modalHistory) closeHistoryModal();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modalHistory.classList.contains('hidden')) {
        closeHistoryModal();
      }
    });
    document.getElementById('history-search').addEventListener('input', renderHistoryModalList);

    document.getElementById('btn-save-history').addEventListener('click', () => {
      executeUserCode(false);
      saveHistorySnapshot(true);
    });

    document.getElementById('btn-clear-all-history').addEventListener('click', async () => {
      if (cachedHistoryList.length === 0) return;
      cachedHistoryList = [];
      await clearHistoryDB();
      updateHistoryBadges();
      renderHistoryModalList();
      showToast('모든 모델 이력이 삭제되었습니다');
    });

    document.getElementById('history-list-container').addEventListener('click', async (e) => {
      const delBtn = e.target.closest('.btn-del-history');
      if (delBtn) {
        e.stopPropagation();
        const id = delBtn.dataset.delId;
        cachedHistoryList = cachedHistoryList.filter((it) => it.id !== id);
        await deleteHistoryIdsDB([id]);
        updateHistoryBadges();
        renderHistoryModalList();
        return;
      }

      const card = e.target.closest('.history-card');
      if (card) {
        const item = cachedHistoryList.find((it) => it.id === card.dataset.id);
        if (item) {
          editorEl.value = item.code;
          localStorage.setItem(STORAGE_KEY, item.code);
          executeUserCode(true, { recordHistory: false });
          closeHistoryModal();
          showToast(`불러옴: ${item.title}`);
        }
      }
    });

    // 초기 실행 & IndexedDB 이력 로드
    executeUserCode(true);
    initHistoryStore();
    animate();
  </script>
</body>
</html>
